# Compila el APK automáticamente en GitHub cada vez que se sube código a main.
# El APK queda en la pestaña "Releases" del repositorio (descarga pública)
# y también como artefacto de la ejecución en la pestaña "Actions".
name: Generar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL del backend para el APK (vacío = http://10.0.2.2:3000/api del emulador)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter (3.24.2)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze lib/main.dart --no-fatal-infos

      - name: Pruebas unitarias
        run: flutter test

      - name: Compilar APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_URL=${{ github.event.inputs.api_url }}

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tienda-g1.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tienda-g1-apk
          path: tienda-g1.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Tienda G1 - APK ${{ github.run_number }}
          files: tienda-g1.apk
          body: |
            APK del prototipo funcional E-commerce Flutter G1 (Computación Móvil).
            Requiere el backend Node.js + Express + MySQL encendido.
            - Emulador Android: usa http://10.0.2.2:3000/api por defecto.
            - Celular físico: en la pantalla de login toca el ícono de servidor
              y escribe http://IP-del-PC:3000/api.
